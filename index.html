    <script>
      // Suppress benign iframe WebSocket reconnection errors in cloud preview
      window.addEventListener('unhandledrejection', function(e) {
        if (e && e.reason && typeof e.reason.message === 'string') {
          if (e.reason.message.includes('WebSocket') || e.reason.message.includes('ws')) {
            e.preventDefault();
          }
        }
      });
